<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Neural Calculator | Suyog Deore</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --accent: #f59e0b;
            --glass: rgba(15, 23, 42, 0.8);
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-hover: rgba(245, 158, 11, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
            overflow: hidden;
            position: relative;
        }

        /* 🏠 HOME BUTTON (Directly from resume.html style) */
        .nav-header {
            position: fixed;
            top: 25px;
            left: 25px;
            z-index: 1000;
        }

        .home-btn {
            text-decoration: none;
            color: #f8fafc;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 10px 22px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .home-btn:hover {
            border-color: var(--accent);
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
            transform: translateY(-2px);
        }

        /* 🌌 BACKGROUND DECORATION */
        body::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--accent);
            filter: blur(150px);
            opacity: 0.15;
            top: 10%;
            left: 10%;
            z-index: -1;
        }

        /* 🧮 CALCULATOR BODY */
        .calculator {
            width: 380px;
            background: var(--glass);
            backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* 📟 DISPLAY AREA */
        .display {
            width: 100%;
            height: 100px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            margin-bottom: 25px;
            padding: 20px;
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        #prev-op {
            font-size: 0.9rem;
            color: var(--accent);
            opacity: 0.7;
            min-height: 20px;
        }

        #current-op {
            font-size: 2.2rem;
            color: #fff;
            font-weight: 600;
            white-space: nowrap;
        }

        /* 🔘 BUTTONS GRID */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 60px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--btn-bg);
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button:hover {
            background: var(--btn-hover);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.2);
        }

        button:active { transform: scale(0.95); }

        .op-btn { color: var(--accent); font-weight: 600; }
        .sci-btn { font-size: 0.85rem; background: rgba(255,255,255,0.02); color: #94a3b8; }
        
        .equal-btn {
            background: var(--accent);
            color: #000;
            font-weight: 700;
            grid-column: span 2;
        }

        .equal-btn:hover {
            background: #fbbf24;
            color: #000;
            box-shadow: 0 0 25px var(--accent);
        }

        .clear-btn { color: #ef4444; }

        /* HEADER */
        .calc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 5px;
        }
        .calc-header span { font-size: 0.7rem; letter-spacing: 2px; color: var(--accent); opacity: 0.8; }
    </style>
</head>
<body>

    <div class="nav-header">
        <a href="index.html" class="home-btn">
            <i class="fas fa-home"></i> Home
        </a>
    </div>

    <div class="calculator">
        <div class="calc-header">
            <span><i class="fas fa-brain"></i> Techby_Suyog</span>
            <i class="fas fa-wifi" style="font-size: 0.7rem; opacity: 0.5;"></i>
        </div>

        <div class="display">
            <div id="prev-op"></div>
            <div id="current-op">0</div>
        </div>

        <div class="buttons">
            <button class="sci-btn" onclick="sciOp('sin')">sin</button>
            <button class="sci-btn" onclick="sciOp('cos')">cos</button>
            <button class="sci-btn" onclick="sciOp('tan')">tan</button>
            <button class="sci-btn" onclick="sciOp('log')">log</button>

            <button class="clear-btn" onclick="clearDisplay()">AC</button>
            <button class="op-btn" onclick="deleteLast()">DEL</button>
            <button class="sci-btn" onclick="sciOp('sqrt')">√</button>
            <button class="op-btn" onclick="appendOp('/')">÷</button>

            <button onclick="appendNum('7')">7</button>
            <button onclick="appendNum('8')">8</button>
            <button onclick="appendNum('9')">9</button>
            <button class="op-btn" onclick="appendOp('*')">×</button>

            <button onclick="appendNum('4')">4</button>
            <button onclick="appendNum('5')">5</button>
            <button onclick="appendNum('6')">6</button>
            <button class="op-btn" onclick="appendOp('-')">-</button>

            <button onclick="appendNum('1')">1</button>
            <button onclick="appendNum('2')">2</button>
            <button onclick="appendNum('3')">3</button>
            <button class="op-btn" onclick="appendOp('+')">+</button>

            <button onclick="appendNum('0')">0</button>
            <button onclick="appendNum('.')">.</button>
            <button class="equal-btn" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const currentDisplay = document.getElementById('current-op');
        const prevDisplay = document.getElementById('prev-op');
        let currentInput = '0';
        let operation = null;
        let shouldResetScreen = false;

        function appendNum(num) {
            if (currentInput === '0' || shouldResetScreen) {
                currentInput = num;
                shouldResetScreen = false;
            } else {
                currentInput += num;
            }
            updateDisplay();
        }

        function appendOp(op) {
            if (operation !== null) calculate();
            operation = op;
            prevDisplay.innerText = `${currentInput} ${op}`;
            shouldResetScreen = true;
        }

        function clearDisplay() {
            currentInput = '0';
            operation = null;
            prevDisplay.innerText = '';
            updateDisplay();
        }

        function deleteLast() {
            currentInput = currentInput.toString().slice(0, -1);
            if (currentInput === '') currentInput = '0';
            updateDisplay();
        }

        function updateDisplay() {
            currentDisplay.innerText = currentInput;
        }

        function calculate() {
            let result;
            const prev = parseFloat(prevDisplay.innerText);
            const current = parseFloat(currentInput);
            if (isNaN(prev) || isNaN(current)) return;

            switch (operation) {
                case '+': result = prev + current; break;
                case '-': result = prev - current; break;
                case '*': result = prev * current; break;
                case '/': result = prev / current; break;
                default: return;
            }

            currentInput = result;
            operation = null;
            prevDisplay.innerText = '';
            shouldResetScreen = true;
            updateDisplay();
        }

        function sciOp(type) {
            const val = parseFloat(currentInput);
            let res;
            switch(type) {
                case 'sin': res = Math.sin(val * Math.PI / 180); break;
                case 'cos': res = Math.cos(val * Math.PI / 180); break;
                case 'tan': res = Math.tan(val * Math.PI / 180); break;
                case 'log': res = Math.log10(val); break;
                case 'sqrt': res = Math.sqrt(val); break;
            }
            currentInput = res.toFixed(4);
            shouldResetScreen = true;
            updateDisplay();
        }

        // --- KEYBOARD LOGIC ---
        window.addEventListener('keydown', (e) => {
            if ((e.key >= '0' && e.key <= '9') || e.key === '.') {
                appendNum(e.key);
            }
            if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') {
                appendOp(e.key);
            }
            if (e.key === 'Enter' || e.key === '=') {
                e.preventDefault();
                calculate();
            }
            if (e.key === 'Backspace') {
                deleteLast();
            }
            if (e.key === 'Escape') {
                clearDisplay();
            }
        });
    </script>
</body>
</html>
