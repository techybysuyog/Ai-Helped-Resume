<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Hub | Suyog Deore</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root{
    --accent-orange: #f59e0b; 
    --accent-blue: #0ea5e9;
    --text: #f8fafc;
    --glass: rgba(15, 23, 42, 0.7);
}

/* 🌌 DEEP SPACE BACKGROUND */
*{ margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }

body{
    min-height: 100vh;
    color: var(--text);
    background: #020617;
    background-image: 
        radial-gradient(circle at 20% 30%, rgba(245, 158, 11, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(14, 165, 233, 0.1) 0%, transparent 50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
}

/* 📍 HEADER */
.header {
    text-align: center;
    margin-bottom: 50px;
    animation: fadeInDown 1s ease;
}

h1 {
    font-size: 2.5rem;
    letter-spacing: 3px;
    background: linear-gradient(to right, #fff, var(--accent-orange));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* 🎛️ PROJECT SELECTOR GRID */
.selector-container {
    display: flex;
    gap: 30px;
    max-width: 900px;
    width: 100%;
    perspective: 1000px;
}

.lang-card {
    flex: 1;
    text-decoration: none;
    color: var(--text);
    background: var(--glass);
    backdrop-filter: blur(20px);
    padding: 60px 40px;
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
    position: relative;
    overflow: hidden;
}

/* Unique Glow for each */
.c-card:hover { border-color: var(--accent-blue); box-shadow: 0 20px 40px rgba(14, 165, 233, 0.2); transform: translateY(-10px) rotateX(5deg); }
.py-card:hover { border-color: var(--accent-orange); box-shadow: 0 20px 40px rgba(245, 158, 11, 0.2); transform: translateY(-10px) rotateX(5deg); }

.lang-card i {
    font-size: 4rem;
    transition: 0.5s;
}

.c-card i { color: var(--accent-blue); }
.py-card i { color: var(--accent-orange); }

.lang-card:hover i { transform: scale(1.2); }

.lang-card h2 { font-size: 1.5rem; font-weight: 600; text-align: center; }
.lang-card p { font-size: 0.85rem; opacity: 0.6; text-align: center; }

/* 🌟 BACKGROUND ANIMATION BEHIND CARDS */
.lang-card::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
    transition: 0.5s;
    pointer-events: none;
}

/* NAVIGATION BUTTONS (Go Home) */
.home-link {
    margin-top: 50px;
    text-decoration: none;
    color: var(--text);
    font-size: 0.9rem;
    border-bottom: 1px solid var(--accent-orange);
    padding-bottom: 5px;
    transition: 0.3s;
}
.home-link:hover { opacity: 0.7; letter-spacing: 1px; }

@keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
}

@media(max-width: 768px) {
    .selector-container { flex-direction: column; }
    .lang-card { padding: 40px 20px; }
}
</style>
</head>
<body>

<div class="header">
    <p style="color: var(--accent-orange); font-size: 0.8rem; letter-spacing: 4px; margin-bottom: 10px;">CHOOSE DOMAIN</p>
    <h1>PROJECT REPOSITORY</h1>
</div>

<div class="selector-container">
    
    <a href="clan.html" class="lang-card c-card">
        <i class="fas fa-code"></i>
        <h2>C Language</h2>
        <p>Embedded Logic, Systems Programming, and Data Structures.</p>
        <div style="margin-top: 10px; font-weight: bold; color: var(--accent-blue);">EXPLORE <i class="fas fa-arrow-right"></i></div>
    </a>

    <a href="pyth.html" class="lang-card py-card">
        <i class="fab fa-python"></i>
        <h2>Python</h2>
        <p>Artificial Intelligence, Automation, and Web Scraping.</p>
        <div style="margin-top: 10px; font-weight: bold; color: var(--accent-orange);">EXPLORE <i class="fas fa-arrow-right"></i></div>
    </a>

</div>

<a href="index.html" class="home-link">Return to Dashboard</a>

<script>
    // Subtle mouse move effect on cards
    const cards = document.querySelectorAll('.lang-card');
    cards.forEach(card => {
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            card.style.setProperty('--mouse-x', `${x}px`);
            card.style.setProperty('--mouse-y', `${y}px`);
        });
    });
</script>

</body>
</html>
