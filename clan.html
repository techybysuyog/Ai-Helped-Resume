<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C Projects | Suyog Deore</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --accent-blue: #0ea5e9;
            --accent-orange: #f59e0b;
            --text: #f8fafc;
            --glass: rgba(15, 23, 42, 0.7);
        }

        /* 🌌 FULL SCREEN ANIMATED BACKGROUND */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            min-height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
            background: #020617;
            /* Syncing with project.html & index.html */
            background-image: 
                radial-gradient(at 0% 0%, rgba(2, 132, 199, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.15) 0px, transparent 50%);
            overflow: hidden;
            position: relative;
        }

        /* 🏠 HOME BUTTON (Matches resume.html) */
        .nav-header {
            position: fixed;
            top: 25px;
            left: 25px;
            z-index: 1000;
        }

        .home-btn {
            text-decoration: none;
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 10px 22px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .home-btn:hover {
            border-color: var(--accent-orange);
            background: var(--accent-orange);
            color: #000;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
            transform: translateY(-2px);
        }

        /* 💎 GLASSY CALCULATOR BUTTON */
        .calc-card-glass {
            text-decoration: none;
            color: #f8fafc;
            width: 90%;
            max-width: 600px;
            background: var(--glass);
            backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 40px;
            display: flex;
            align-items: center;
            gap: 25px;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
            animation: fadeInScale 0.8s ease;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .calc-card-glass:hover {
            transform: translateY(-10px);
            border-color: var(--accent-blue);
            box-shadow: 0 30px 60px rgba(14, 165, 233, 0.2);
            background: rgba(15, 23, 42, 0.85);
        }

        .icon-sphere {
            width: 70px;
            height: 70px;
            background: rgba(14, 165, 233, 0.1);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: var(--accent-blue);
            transition: 0.5s;
        }

        .calc-card-glass:hover .icon-sphere {
            background: var(--accent-blue);
            color: #020617;
            transform: rotate(-10deg) scale(1.1);
        }

        .content-info h3 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            background: linear-gradient(to right, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .content-info p {
            font-size: 0.85rem;
            color: #94a3b8;
            line-height: 1.6;
        }

        .status-tag {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 0.65rem;
            letter-spacing: 3px;
            opacity: 0.3;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="nav-header">
        <a href="index.html" class="home-btn">
            <i class="fas fa-home"></i> Home
        </a>
    </div>

    <a href="calculator.html" class="calc-card-glass">
        <div class="icon-sphere">
            <i class="fas fa-microchip"></i>
        </div>
        <div class="content-info">
            <h3>Project Calculator</h3>
            <p>Scientific interface integrated with <strong>calc.c</strong> backend for ultra-fast neural math processing.</p>
        </div>
        <i class="fas fa-chevron-right" style="margin-left: auto; color: var(--accent-blue);"></i>
    </a>

    <div class="status-tag">suyog Deore</div>

</body>
</html>
